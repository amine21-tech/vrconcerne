# -----------------------------------------------------------------------------
# Reverse proxy Nginx pour l'API VRconcerneDZ.
#
# Remplacez api.vrconcerne.dz par votre vrai (sous-)domaine avant d'utiliser
# ce fichier. Obtenez d'abord un certificat TLS pour ce domaine :
#
#   sudo certbot --nginx -d api.vrconcerne.dz
#
# certbot reecrit ensuite ce bloc pour ajouter listen 443 ssl et les chemins
# de certificat — ne le faites pas a la main avant.
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name api.vrconcerne.dz;

    location / {
        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Chargily doit pouvoir joindre le webhook sans etre bloque par un
    # eventuel filtrage applicatif en amont.
    location /webhooks/chargily {
        proxy_pass http://127.0.0.1:3101/webhooks/chargily;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
